version: "3.9"

networks:
  upload_net:
    driver: bridge

volumes:
  minio_data:
  redis_data:

services:
  redis:
    image: redis:7.2-alpine
    container_name: upload_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redisSecret123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - upload_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redisSecret123}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: upload_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    networks:
      - upload_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio_init:
    image: minio/mc:latest
    container_name: upload_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - upload_net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin123};
        mc mb --ignore-existing local/${MINIO_BUCKET:-uploads};
        mc anonymous set none local/${MINIO_BUCKET:-uploads};
        echo 'Bucket ready.';
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upload_backend
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: development
      SERVER_PORT: 8080
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redisSecret123}
      REDIS_DB: 0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-uploads}
      MINIO_USE_SSL: "false"
      CHUNK_SIZE_BYTES: 5242880        # 5 MB
      MAX_FILE_SIZE_BYTES: 10737418240 # 10 GB
      UPLOAD_TTL_HOURS: 24
    ports:
      - "8080:8080"
    networks:
      - upload_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    container_name: upload_frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - upload_net
